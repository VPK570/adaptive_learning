<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - UniAI</title>
    <meta name="description" content="Sign in to your UniAI account." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="glow-bg"></div>
      <main class="auth-card">
        <header class="auth-header">
          <div class="brand-logo" aria-hidden="true">
            <!-- Academic cap icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <h1 class="auth-title">UniAI</h1>
          <p class="auth-subtitle">University AI Platform</p>
        </header>

        <div class="role-tabs" id="role-tabs">
          <div class="role-tab-slider" id="role-tab-slider"></div>
          <button class="role-tab is-active" type="button" data-index="0">Student</button>
          <button class="role-tab" type="button" data-index="1">Faculty</button>
          <button class="role-tab" type="button" data-index="2">Admin</button>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Institutional Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Mail icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="M2 6l10 7 10-7"/>
                </svg>
              </span>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="name@university.edu"
                required 
              />
            </div>
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label for="password" class="form-label">Password</label>
              <a href="#" class="auth-link">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Lock icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="••••••••"
                required 
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span class="btn-text">Sign In</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <footer class="auth-footer">
          <p class="auth-footer-text">
            Don't have an account? <a href="#" class="auth-link">Create an account</a>
          </p>
          <div class="trust-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M12 8v4"/>
              <path d="M12 16h.01"/>
            </svg>
            <span>Your data stays within your institution's infrastructure</span>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
