services:
  surrealdb:
    container_name: surrealdb
    image: surrealdb/surrealdb:latest
    user: root
    command: start --user root --pass root surrealkv://data/surrealdb.db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=adaptive_learning
      - SURREAL_DB=learning_platform
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/adaptive_learning}
      - BASE_STORAGE_DIR=/app/storage
      - CHROMA_PATH=/app/chroma_db
    depends_on:
      - surrealdb
      - postgres
    volumes:
      - ./backend/storage:/app/storage
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: ./new_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=adaptive_learning
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  surreal_data:
  postgres_data: