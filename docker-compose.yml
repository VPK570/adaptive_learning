services:
  surrealdb:
    container_name: surrealdb
    image: surrealdb/surrealdb:latest
    user: root
    command: start --user root --pass root surrealkv://data/surrealdb.db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=adaptive_learning
      - SURREAL_DB=learning_platform
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-001}
      - OPENROUTER_API_KEYS=${OPENROUTER_API_KEYS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_STORAGE_DIR=/app/storage
      - CHROMA_PATH=/app/chroma_db
    depends_on:
      - surrealdb
    volumes:
      - ./backend/storage:/app/storage
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: ./new_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend


volumes:
  surreal_data: